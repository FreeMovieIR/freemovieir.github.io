name: Watch Party Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: watch-party-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix services/media-gateway

      - name: Unit tests
        run: npm run watch-party:test

      - name: Firebase Rules tests
        run: npm run watch-party:test:rules

      - name: Build Pages artifact
        run: npm run pages:build
        env:
          WATCH_PARTY_ENVIRONMENT: production
          WATCH_PARTY_FIREBASE_API_KEY: ${{ vars.WATCH_PARTY_FIREBASE_API_KEY }}
          WATCH_PARTY_FIREBASE_AUTH_DOMAIN: ${{ vars.WATCH_PARTY_FIREBASE_AUTH_DOMAIN }}
          WATCH_PARTY_FIREBASE_DATABASE_URL: ${{ vars.WATCH_PARTY_FIREBASE_DATABASE_URL }}
          WATCH_PARTY_FIREBASE_PROJECT_ID: ${{ vars.WATCH_PARTY_FIREBASE_PROJECT_ID }}
          WATCH_PARTY_FIREBASE_APP_ID: ${{ vars.WATCH_PARTY_FIREBASE_APP_ID }}
          WATCH_PARTY_APP_CHECK_SITE_KEY: ${{ vars.WATCH_PARTY_APP_CHECK_SITE_KEY }}
          WATCH_PARTY_TURN_CREDENTIALS_ENDPOINT: ${{ vars.WATCH_PARTY_TURN_CREDENTIALS_ENDPOINT }}
          WATCH_PARTY_RTC_ICE_SERVERS: ${{ vars.WATCH_PARTY_RTC_ICE_SERVERS }}
          WATCH_PARTY_PUBLIC_ROOMS_ENABLED: ${{ vars.WATCH_PARTY_PUBLIC_ROOMS_ENABLED }}
          WATCH_PARTY_PUBLIC_ROOMS_CREATION_ENABLED: ${{ vars.WATCH_PARTY_PUBLIC_ROOMS_CREATION_ENABLED }}
          WATCH_PARTY_PUBLIC_ROOMS_MAINTENANCE: ${{ vars.WATCH_PARTY_PUBLIC_ROOMS_MAINTENANCE }}
          WATCH_PARTY_MEDIA_GATEWAY_ENABLED: ${{ vars.WATCH_PARTY_MEDIA_GATEWAY_ENABLED }}
          WATCH_PARTY_MEDIA_GATEWAY_BASE_URL: ${{ vars.WATCH_PARTY_MEDIA_GATEWAY_BASE_URL }}

      - name: Inspect Pages artifact
        run: npm run pages:test

      - name: Artifact statistics
        shell: bash
        run: |
          set -euo pipefail
          count="$(find dist -type f | wc -l)"
          bytes="$(du -sb dist | cut -f1)"
          echo "Artifact files: ${count}"
          echo "Artifact bytes: ${bytes}"
          if [ "${bytes}" -gt 78643200 ]; then
            echo "Artifact exceeds 75 MiB limit" >&2
            exit 1
          fi
          echo "Largest files:"
          find dist -type f -printf '%s %p\n' | sort -nr | head -20

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
