name: Watch Party Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: watch-party-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run watch-party:test

      - name: Generate Watch Party runtime config
        run: node scripts/generate-watch-party-config.mjs --mode=production
        env:
          WATCH_PARTY_ENVIRONMENT: production
          WATCH_PARTY_FIREBASE_API_KEY: ${{ vars.WATCH_PARTY_FIREBASE_API_KEY }}
          WATCH_PARTY_FIREBASE_AUTH_DOMAIN: ${{ vars.WATCH_PARTY_FIREBASE_AUTH_DOMAIN }}
          WATCH_PARTY_FIREBASE_DATABASE_URL: ${{ vars.WATCH_PARTY_FIREBASE_DATABASE_URL }}
          WATCH_PARTY_FIREBASE_PROJECT_ID: ${{ vars.WATCH_PARTY_FIREBASE_PROJECT_ID }}
          WATCH_PARTY_FIREBASE_APP_ID: ${{ vars.WATCH_PARTY_FIREBASE_APP_ID }}
          WATCH_PARTY_APP_CHECK_SITE_KEY: ${{ vars.WATCH_PARTY_APP_CHECK_SITE_KEY }}
          WATCH_PARTY_TURN_CREDENTIALS_ENDPOINT: ${{ vars.WATCH_PARTY_TURN_CREDENTIALS_ENDPOINT }}
          WATCH_PARTY_RTC_ICE_SERVERS: ${{ vars.WATCH_PARTY_RTC_ICE_SERVERS }}

      - name: Production-shape checks
        run: npm run watch-party:test:production

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
